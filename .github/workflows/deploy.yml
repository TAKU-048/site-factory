# 2026-10-31 ユーザー指示「このMacがネットになくても一連の作業が進むように」：
# お客様サイト・デモ・確認用プレビューを、Mac ではなく GitHub から Cloudflare へ公開する。
#
# 動き：
#  ・main に deploy/**/*.wrangler.jsonc（公開設定）が追加・変更されたら、その設定が指す clients/<顧客ID> をビルドして公開する
#  ・clients/<顧客ID>/ の中身が変わったら、その顧客を指す公開設定をすべて公開し直す
#  ・手動（Actions の「Run workflow」）で公開設定のパスを指定して公開することもできる
# 必要なシークレット（GitHub のリポジトリ設定 → Secrets and variables → Actions）：
#  ・CLOUDFLARE_API_TOKEN（Cloudflare の「Edit Cloudflare Workers」テンプレートで作るトークン）
#  ・CLOUDFLARE_ACCOUNT_ID
# EmDash のサイト（clients/<顧客ID>-cms）はこのワークフローの対象外（docs/emdash.md の手順で公開する）。
name: Cloudflare に公開

on:
  push:
    branches: [main]
    paths:
      - "deploy/**/*.wrangler.jsonc"
      - "clients/**"
  workflow_dispatch:
    inputs:
      config:
        description: "公開設定のパス（例：deploy/previews/za-sauna-preview.wrangler.jsonc）"
        required: true

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 公開する設定を決める
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "${{ github.event.inputs.config }}" > configs.txt
          else
            changed=$(git diff --name-only HEAD~1 HEAD || true)
            : > configs.txt
            # 変わった公開設定
            echo "$changed" | grep -E '^deploy/.+\.wrangler\.jsonc$' >> configs.txt || true
            # 中身が変わった顧客を指している公開設定
            for id in $(echo "$changed" | grep -E '^clients/[^/]+/' | cut -d/ -f2 | sort -u); do
              case "$id" in *-cms) continue;; esac
              grep -lE "\"\.\./\.\./clients/${id}/dist\"" deploy/*/*.wrangler.jsonc >> configs.txt 2>/dev/null || true
            done
            sort -u configs.txt -o configs.txt
          fi
          sed -i '/^$/d' configs.txt
          echo "公開する設定："; cat configs.txt || true
          echo "count=$(wc -l < configs.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: ビルドして公開
        if: steps.pick.outputs.count != '0'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID が未設定です"; exit 1
          fi
          while read -r cfg; do
            [ -f "$cfg" ] || { echo "::error::公開設定がありません：$cfg"; exit 1; }
            dir=$(grep -oE '"\.\./\.\./clients/[^"]+/dist"' "$cfg" | head -1 | sed -E 's#"\.\./\.\./(clients/[^"]+)/dist"#\1#')
            [ -n "$dir" ] && [ -d "$dir" ] || { echo "::error::$cfg の公開フォルダ（clients/<顧客ID>/dist）が読み取れません"; exit 1; }
            echo "== ビルド：$dir"
            (cd "$dir" && npm ci --no-audit --no-fund && npm run build)
            # 公開前チェック（AGENTS.md）：PHPのファイルを公開しない
            if find "$dir/dist" -name '*.php' | grep -q .; then echo "::error::$dir/dist に .php があります"; exit 1; fi
            echo "== 公開：$cfg"
            npx --yes wrangler@4 deploy --config "$cfg"
          done < configs.txt
